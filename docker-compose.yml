services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.17.8
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

  api:
    build: .
    container_name: findings-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - AWS_CONFIG_FILE=/aws/config
      - AWS_SHARED_CREDENTIALS_FILE=/aws/credentials
      - GEOIP_DB_PATH=/data/geoip-country.mmdb
    volumes:
      - ${USERPROFILE}/.aws-findings:/aws:ro
      - ./data:/data:ro

volumes:
  n8n_data: